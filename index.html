<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chris Muscat — Photographer</title>
    <meta
      name="description"
      content="Chris Muscat is a photographer based in Melbourne. Editorial, portrait, fashion and architectural photography — selected work 2019–2026."
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="canonical" href="https://chrismuscatphotography.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chris Muscat" />
    <meta property="og:title" content="Chris Muscat — Photographer" />
    <meta
      property="og:description"
      content="Editorial, portrait, fashion and architectural photography. Selected work 2019–2026."
    />
    <meta property="og:image" content="https://chrismuscatphotography.com/images/site/hero-1600.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts: editorial serif + minimalist sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Playfair+Display:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- GitHub Pages SPA restore: 404.html stores the attempted URL here so
         deep links and refreshes resolve to the correct client-side route. -->
    <script>
      (function () {
        var redirect = sessionStorage.getItem('redirect');
        sessionStorage.removeItem('redirect');
        if (redirect && redirect !== window.location.href) {
          window.history.replaceState(null, '', redirect);
        }
      })();
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Chris Muscat",
        "jobTitle": "Photographer",
        "url": "https://chrismuscatphotography.com/",
        "sameAs": ["https://instagram.com/chrismuscatphotography"],
        "address": { "@type": "PostalAddress", "addressLocality": "Melbourne", "addressCountry": "AU" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: Georgia, serif;">
        Chris Muscat — Photographer. This portfolio requires JavaScript. Contact:
        hello@chrismuscatphotography.com
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
