# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS — git-based admin for this portfolio, served at /admin.
#
# Sign-in: "Sign in with token" using a GitHub Personal Access Token with
#   Contents: Read & write  on commerce-dash/chrismuscatphotography
#   (github.com → Settings → Developer settings → Personal access tokens →
#    Fine-grained tokens → repo-scoped).
#
# Optional upgrade for one-click "Sign in with GitHub" OAuth:
#   deploy github.com/sveltia/sveltia-cms-auth (free Cloudflare Worker)
#   and uncomment base_url below.

backend:
  name: github
  repo: commerce-dash/chrismuscatphotography
  branch: main
  # base_url: https://YOUR-WORKER.workers.dev
  auth_methods: [token, oauth]
  commit_messages:
    create: 'cms: create {{collection}} "{{slug}}"'
    update: 'cms: update {{collection}} "{{slug}}"'
    delete: 'cms: delete {{collection}} "{{slug}}"'
    uploadMedia: 'cms: upload "{{path}}"'
    deleteMedia: 'cms: delete media "{{path}}"'

site_url: https://chrismuscatphotography.com

# Drag-and-drop uploads land here; the build pipeline converts each
# original into responsive WebP ({name}-{width}.webp) automatically.
media_folder: /public/images/uploads
public_folder: /images/uploads

# Upload hygiene:
#   slugify_filename — 'NIK_0619 (1).JPG' -> 'nik-0619-1.webp' (safe URLs)
#   raster_image     — resize/re-encode in the browser BEFORE commit.
#                      The GitHub backend commits each upload batch in one
#                      GraphQL request; unmodified camera JPEGs (5-15MB each)
#                      exceed its payload limit and the whole batch fails.
#                      Capping at 2560px/q85 webp (~300-600KB) makes multi-file
#                      uploads reliable; the build still emits the srcset sizes.
media_libraries:
  default:
    config:
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2560
          height: 2560

collections:
  # ------------------------------------------------------------------
  - name: projects
    label: Projects
    label_singular: Project
    folder: /content/projects
    extension: json
    format: json
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{title}} — {{year}}'
    sortable_fields: [order, title, year]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Slug, name: slug, widget: string, required: false, hint: 'URL segment — page lives at /work/<slug>. Use lowercase-hyphens. Blank = filename.' }
      - { label: 'Redirect old URL', name: redirect, widget: boolean, default: false, required: false, hint: 'When set and the slug differs from the file name, permanently redirects /work/<file-name> to the new slug.' }
      - label: 'Additional old URLs'
        name: redirectFrom
        widget: list
        required: false
        field: { label: 'Old slug', name: old, widget: string }
        hint: 'e.g. desert-light — redirects /work/desert-light to this page'
      - { label: Category, name: category, widget: select, options: [Urban, Travel, Portraits, Family, Music, Animals, Landscapes] }
      - { label: Year, name: year, widget: number, value_type: int, min_value: 1990, max_value: 2100 }
      - { label: 'End year', name: yearTo, widget: number, value_type: int, min_value: 1990, max_value: 2100, required: false, hint: 'For work spanning years — shows a range like 2019–2026. Leave blank for a single year.' }
      - { label: Location, name: location, widget: string, required: false, hint: 'Leave blank for work shot across many places.' }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Cover Image, name: coverImage, widget: image }
      - { label: Featured on homepage, name: featured, widget: boolean, default: false }
      - label: Sort order
        name: order
        widget: number
        value_type: int
        required: false
        hint: Lower numbers appear first in Work and homepage listings.
      - label: Tags
        name: tags
        widget: list
        required: false
        field: { label: Tag, name: tag, widget: string }
      - label: Gallery
        name: blocks
        widget: list
        hint: 'Compose the project page: full = edge-to-edge, feature = large inset, pair = two side by side, offset = asymmetric.'
        fields:
          - label: Layout
            name: layout
            widget: select
            options: [full, feature, pair, offset]
          - label: Images
            name: images
            widget: list
            field: { label: Image, name: image, widget: image }
          - { label: Caption, name: caption, widget: string, required: false }

  # ------------------------------------------------------------------
  - name: settings
    label: Site Settings
    icon: settings
    files:
      - name: site
        label: Identity & Navigation
        file: /content/site.json
        format: json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Role, name: role, widget: string }
          - { label: Location, name: location, widget: string }
          - { label: Locations line, name: locations, widget: string, hint: 'Shown in the hero and footer, e.g. "Melbourne · Sydney"' }
          - { label: Email, name: email, widget: string }
          - { label: Instagram URL, name: instagram, widget: string }
          - { label: Instagram handle, name: instagramHandle, widget: string }
          - label: Homepage hero
            name: hero
            widget: object
            fields:
              - { label: Hero image, name: image, widget: image }
              - { label: Overline, name: overline, widget: string, hint: 'Small line above the title' }
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - label: Text alignment
                name: align
                widget: select
                options:
                  - { label: Bottom left, value: left }
                  - { label: Centered, value: center }
                default: left
          - label: Homepage sections
            name: home
            widget: object
            fields:
              - { label: Show statement, name: showStatement, widget: boolean, default: true }
          - label: Theme
            name: theme
            widget: object
            fields:
              - label: Serif font
                name: serif
                widget: select
                options: [Fraunces, Cormorant Garamond, Playfair Display]
                default: Fraunces
                hint: Used for titles, project names and editorial text.
          - { label: Homepage statement, name: statement, widget: text }
          - { label: Work page subtitle, name: workSub, widget: string, hint: 'Line under the "Work" heading, e.g. "Selected photographs and projects"' }
          - label: Navigation
            name: nav
            widget: list
            summary: '{{fields.label}}'
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Path, name: path, widget: string, hint: '/work, /about, /search, /contact' }

      - name: image-alt
        label: Image Alt Text
        file: /content/image-alt.json
        format: json
        fields:
          - label: Alt text by image
            name: alts
            widget: keyvalue
            hint: 'Key = image name without extension (e.g. uploads/NIK_7833). Value = short description shown to screen readers.'

      - name: about
        label: About Page
        file: /content/about.json
        format: json
        fields:
          - { label: Portrait, name: portrait, widget: image }
          - label: Biography
            name: bio
            widget: list
            field: { label: Paragraph, name: paragraph, widget: text }
          - label: Selected Clients
            name: clients
            widget: list
            required: false
            field: { label: Client, name: client, widget: string }
          - label: Publications
            name: publications
            widget: list
            required: false
            field: { label: Publication, name: publication, widget: string }
          - label: Awards
            name: awards
            widget: list
            required: false
            field: { label: Award, name: award, widget: string }
          - label: Exhibitions
            name: exhibitions
            widget: list
            required: false
            field: { label: Exhibition, name: exhibition, widget: string }
