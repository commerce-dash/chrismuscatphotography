<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager — Chris Muscat</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script>
      // Storefront-matching preview for the Projects collection.
      // Mirrors the block layouts in src/styles/global.css (.block--full /
      // feature / pair / offset) so the preview pane shows the gallery the
      // way it will render on the live site.
      const resolveImage = (getAsset, src) => {
        if (!src || !getAsset) return src;
        const a = getAsset(src);
        if (!a) return src;
        if (typeof a === 'string') return a;
        const url = a.url || String(a);
        return url && url !== '[object Object]' ? url : src;
      };

      const ProjectPreview = createClass({
        render() {
          const { entry, getAsset } = this.props;
          const data = entry.get('data').toJS();
          const blocks = data.blocks || [];
          const overline = [
            data.category,
            data.yearTo ? `${data.year}–${data.yearTo}` : data.year,
            data.location,
          ]
            .filter(Boolean)
            .join(' · ');

          return h(
            'div',
            { className: 'pv' },
            h(
              'header',
              { className: 'pv-head' },
              overline ? h('p', { className: 'pv-overline' }, overline) : null,
              h('h1', { className: 'pv-title' }, data.title || ''),
              data.description
                ? h('p', { className: 'pv-desc' }, data.description)
                : null
            ),
            h(
              'div',
              { className: 'pv-gallery' },
              blocks.map((block, bi) =>
                h(
                  'div',
                  {
                    key: bi,
                    className: `block block--${block.layout || 'feature'}${
                      block.layout === 'trio' && block.side === 'right'
                        ? ' block--trio--right'
                        : ''
                    }`,
                  },
                  (block.images || []).map((src, ii) =>
                    h(
                      'figure',
                      { key: `${bi}-${ii}`, className: `block__item block__item--${ii}` },
                      h('img', {
                        src: resolveImage(getAsset, src),
                        alt: '',
                        loading: 'lazy',
                      })
                    )
                  ),
                  block.caption
                    ? h('p', { key: 'caption', className: 'block__caption' }, block.caption)
                    : null
                )
              )
            )
          );
        },
      });

      // Storefront-matching preview for the Site Settings file — renders the
      // homepage hero + statement the way the live site does, including the
      // chosen serif face.
      const SitePreview = createClass({
        render() {
          const { entry, getAsset } = this.props;
          const data = entry.get('data').toJS();
          const hero = data.hero || {};
          const serif = (data.theme && data.theme.serif) || 'Fraunces';
          const showStatement =
            !data.home || data.home.showStatement !== false;

          return h(
            'div',
            {
              className: 'pv',
              style: { '--pv-serif': `'${serif}', Georgia, serif` },
            },
            h(
              'section',
              { className: 'pv-hero' },
              hero.image
                ? h('img', {
                    className: 'pv-hero__img',
                    src: resolveImage(getAsset, hero.image),
                    alt: '',
                  })
                : null,
              h('div', { className: 'pv-hero__overlay' }),
              h(
                'div',
                {
                  className: `pv-hero__content${
                    hero.align === 'center' ? ' pv-hero__content--center' : ''
                  }`,
                },
                hero.overline
                  ? h('p', { className: 'pv-overline' }, hero.overline)
                  : null,
                h('h1', { className: 'pv-hero__title' }, hero.title || ''),
                hero.subtitle
                  ? h('p', { className: 'pv-hero__sub' }, hero.subtitle)
                  : null
              )
            ),
            showStatement && data.statement
              ? h(
                  'section',
                  { className: 'pv-statement' },
                  h('p', { className: 'pv-statement__text' }, data.statement)
                )
              : null,
            h(
              'p',
              { className: 'pv-note' },
              'Homepage — the featured projects grid follows on the live site.'
            )
          );
        },
      });

      CMS.registerPreviewStyle(
        'https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Cormorant+Garamond:ital,wght@0,300..600;1,300..600&family=Playfair+Display:ital,wght@0,300..700;1,300..700&display=swap'
      );
      CMS.registerPreviewStyle(
        `
        :root { color-scheme: dark; }
        body {
          background: #161513;
          color: #ece8e0;
          font-family: 'Segoe UI', system-ui, sans-serif;
          margin: 0;
        }
        .pv-head {
          padding: 72px 24px 48px;
          max-width: 1100px;
        }
        .pv-overline {
          font-size: 11px;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: #a09a8f;
          margin: 0 0 1.4rem;
        }
        .pv-title {
          font-family: var(--pv-serif, 'Fraunces', Georgia, serif);
          font-weight: 300;
          font-size: clamp(3rem, 8vw, 6.8rem);
          line-height: 1.04;
          letter-spacing: -0.01em;
          margin: 0;
        }
        .pv-desc {
          margin: 32px 0 0;
          font-family: var(--pv-serif, 'Fraunces', Georgia, serif);
          font-weight: 300;
          font-size: clamp(1.1rem, 1.9vw, 1.45rem);
          line-height: 1.6;
          color: #a09a8f;
          max-width: 46ch;
        }
        .pv-hero {
          position: relative;
          height: 82vh;
          min-height: 420px;
          overflow: hidden;
          background: #26241f;
        }
        .pv-hero__img {
          position: absolute; inset: 0;
          width: 100%; height: 100%; object-fit: cover;
        }
        .pv-hero__overlay {
          position: absolute; inset: 0;
          background:
            linear-gradient(to top, rgba(16,15,13,0.62), rgba(16,15,13,0.05) 45%),
            linear-gradient(to bottom, rgba(16,15,13,0.25), transparent 30%);
        }
        .pv-hero__content {
          position: absolute; left: 24px; right: 24px;
          bottom: clamp(40px, 9vh, 80px);
        }
        .pv-hero__content--center {
          text-align: center; bottom: auto;
          top: 50%; transform: translateY(-50%);
        }
        .pv-hero__title {
          font-family: var(--pv-serif, 'Fraunces', Georgia, serif);
          font-style: italic; font-weight: 300;
          font-size: clamp(3rem, 9vw, 7rem);
          line-height: 1.02; letter-spacing: -0.01em; margin: 0;
        }
        .pv-hero__sub {
          margin-top: 1.2rem;
          font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase;
        }
        .pv-statement { padding: 96px 24px; }
        .pv-statement__text {
          font-family: var(--pv-serif, 'Fraunces', Georgia, serif);
          font-weight: 300;
          font-size: clamp(1.6rem, 4vw, 3rem);
          line-height: 1.35; max-width: 22em; margin: 0;
        }
        .pv-note {
          padding: 0 24px 64px; margin: 0;
          font-size: 11px; letter-spacing: 0.14em;
          text-transform: uppercase; color: #6f6a61;
        }
        .pv-gallery {
          padding: 0 24px 80px;
          display: flex;
          flex-direction: column;
          gap: clamp(48px, 8vw, 130px);
        }
        .block { display: grid; gap: 24px; }
        .block--full { margin-inline: -24px; }
        .block--feature { width: min(76%, 1150px); margin-inline: auto; }
        .block--pair { grid-template-columns: 1fr 1fr; align-items: start; }
        .block--offset { grid-template-columns: repeat(12, 1fr); align-items: start; }
        .block--offset .block__item:nth-child(4n + 1) { grid-column: 1 / 8; }
        .block--offset .block__item:nth-child(4n + 2) {
          grid-column: 9 / 13;
          margin-top: clamp(40px, 12vw, 180px);
        }
        .block--offset .block__item:nth-child(4n + 3) {
          grid-column: 1 / 6;
          margin-top: clamp(24px, 6vw, 96px);
        }
        .block--offset .block__item:nth-child(4n + 4) {
          grid-column: 6 / 13;
          margin-top: clamp(48px, 10vw, 150px);
        }
        .block--trio { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; align-items: stretch; }
        .block--trio .block__item--0 { grid-row: 1 / -1; grid-column: 1; }
        .block--trio .block__item--1 { grid-column: 2; grid-row: 1; }
        .block--trio .block__item--2 { grid-column: 2; grid-row: 2; }
        .block--trio .block__item--0 img { height: 100%; object-fit: cover; }
        .block--trio .block__item--1 img,
        .block--trio .block__item--2 img { aspect-ratio: 3 / 2; object-fit: cover; }
        .block--trio--right .block__item--0 { grid-column: 2; }
        .block--trio--right .block__item--1,
        .block--trio--right .block__item--2 { grid-column: 1; }
        .block--mosaic {
          grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
          gap: 0;
          margin-inline: -24px;
        }
        .block--mosaic .block__item img { aspect-ratio: 2 / 3; height: 100%; object-fit: cover; }
        .block--mosaic .block__caption { margin-top: 12px; padding-inline: 24px; }
        .block__item { margin: 0; }
        .block__item img { display: block; width: 100%; height: auto; }
        .block__caption {
          grid-column: 1 / -1;
          margin: -12px 0 0;
          font-size: 11px;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #6f6a61;
          text-align: right;
        }
        @media (max-width: 768px) {
          .block--pair, .block--offset, .block--trio { grid-template-columns: 1fr; gap: 20px; }
          .block--offset .block__item { grid-column: 1 / -1 !important; margin-top: 0 !important; }
          .block--offset .block__item:nth-child(even) { width: 78%; margin-left: auto; }
          .block--trio { grid-template-rows: none; }
          .block--trio .block__item { grid-column: 1 / -1 !important; grid-row: auto !important; }
          .block--trio .block__item--0 img { height: auto; aspect-ratio: 3 / 4; }
          .block--feature { width: 100%; }
        }
        `,
        { raw: true }
      );
      CMS.registerPreviewTemplate('projects', ProjectPreview);
      CMS.registerPreviewTemplate('site', SitePreview);

      // ---- Sync media button -------------------------------------------------
      // Triggers the "Sync media" GitHub Actions workflow, which optimizes new
      // originals in /images/uploads, regenerates responsive variants, commits,
      // and redeploys. Uses the GitHub token Sveltia stored at login when
      // available; otherwise opens the workflow's manual-run page.
      const SYNC_REPO = 'commerce-dash/chrismuscatphotography';
      const SYNC_WORKFLOW = 'sync-media.yml';
      const SYNC_PAGE = `https://github.com/${SYNC_REPO}/actions/workflows/${SYNC_WORKFLOW}`;

      const TOKEN_RE = /\b((?:ghp|gho|ghu|ghs|ghr|github_pat)_[A-Za-z0-9_]+)\b/;
      const extractToken = (v) => {
        if (typeof v !== 'string') v = JSON.stringify(v);
        const m =
          v.match(/"(?:access_token|token|tokenValue)"\s*:\s*"([^"]+)"/) ||
          v.match(TOKEN_RE);
        return m ? m[1] : null;
      };

      const findGhToken = async () => {
        for (const store of [localStorage, sessionStorage]) {
          for (let i = 0; i < store.length; i++) {
            const t = extractToken(store.getItem(store.key(i)) || '');
            if (t) return t;
          }
        }
        // Sveltia may keep the session in IndexedDB on newer versions.
        try {
          for (const { name } of (await indexedDB.databases?.()) || []) {
            const db = await new Promise((res) => {
              const r = indexedDB.open(name);
              r.onsuccess = () => res(r.result);
              r.onerror = () => res(null);
            });
            if (!db) continue;
            for (const storeName of db.objectStoreNames) {
              const vals = await new Promise((res) => {
                const r = db.transaction(storeName).objectStore(storeName).getAll();
                r.onsuccess = () => res(r.result || []);
                r.onerror = () => res([]);
              });
              for (const v of vals) {
                const t = extractToken(v);
                if (t) {
                  db.close();
                  return t;
                }
              }
            }
            db.close();
          }
        } catch {}
        return null;
      };

      const setSyncStatus = (msg, sticky) => {
        const el = document.getElementById('sync-media-status');
        el.textContent = msg;
        el.style.opacity = '1';
        if (!sticky) setTimeout(() => (el.style.opacity = '0'), 6000);
      };

      const makeGh = (token) => (path, opts = {}) =>
        fetch(`https://api.github.com/repos/${SYNC_REPO}${path}`, {
          ...opts,
          headers: {
            Authorization: `Bearer ${token}`,
            Accept: 'application/vnd.github+json',
            'Content-Type': 'application/json',
            ...(opts.headers || {}),
          },
        });

      // Preferred: dispatch the workflow directly (needs Actions scope).
      // Fallback: commit a trigger file (works with Contents-only tokens) —
      // the push runs the sync workflow via its paths filter.
      const triggerSync = async (gh) => {
        const res = await gh(
          `/actions/workflows/${SYNC_WORKFLOW}/dispatches`,
          { method: 'POST', body: JSON.stringify({ ref: 'main' }) }
        );
        if (res.ok) return 'Sync started — site redeploys in a few minutes.';

        let sha;
        const cur = await gh('/contents/.sync-trigger');
        if (cur.ok) sha = (await cur.json()).sha;
        const put = await gh('/contents/.sync-trigger', {
          method: 'PUT',
          body: JSON.stringify({
            message: 'chore: trigger media sync',
            content: btoa(`sync ${Date.now()}\n`),
            branch: 'main',
            ...(sha ? { sha } : {}),
          }),
        });
        if (put.ok) return 'Sync queued — site redeploys in a few minutes.';
        throw new Error(`HTTP ${put.status}`);
      };

      const syncMedia = async () => {
        const btn = document.getElementById('sync-media-btn');
        btn.disabled = true;
        setSyncStatus('Syncing media…', true);
        try {
          const token = await findGhToken();
          if (!token) throw new Error('not signed in');
          setSyncStatus(await triggerSync(makeGh(token)));
          return;
        } catch (e) {
          setSyncStatus(
            `Couldn't trigger sync from here (${e.message}). Opening GitHub — click "Run workflow".`,
            true
          );
          window.open(SYNC_PAGE, '_blank', 'noopener');
        } finally {
          setTimeout(() => (btn.disabled = false), 30000);
        }
      };

      // ---- Push local folder -------------------------------------------------
      // "Sync media" runs on GitHub and can't see files dropped in the local
      // uploads folder. This button uses the File System Access API (Chrome /
      // Edge): pick the uploads folder once, then it diffs filenames against
      // the repo, commits the new ones in a single commit, and fires the sync
      // workflow — optimize, variants, alts, deploy — all in one click.
      const IMG_RE = /\.(jpe?g|png|webp|avif|gif|tiff?)$/i;
      const HANDLE_KEY = 'uploads-dir-handle';

      const idb = () =>
        new Promise((res, rej) => {
          const r = indexedDB.open('cmp-admin', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('kv');
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        });
      const idbGet = async (k) => {
        const db = await idb();
        return new Promise((res) => {
          const r = db.transaction('kv').objectStore('kv').get(k);
          r.onsuccess = () => res(r.result);
          r.onerror = () => res(undefined);
        });
      };
      const idbSet = async (k, v) => {
        const db = await idb();
        return new Promise((res, rej) => {
          const r = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k);
          r.onsuccess = () => res();
          r.onerror = () => rej(r.error);
        });
      };

      const getUploadsDir = async () => {
        let h = await idbGet(HANDLE_KEY);
        if (h) {
          if ((await h.queryPermission({ mode: 'read' })) === 'granted') return h;
          if ((await h.requestPermission({ mode: 'read' })) === 'granted') return h;
        }
        h = await showDirectoryPicker({ id: 'uploads' });
        await idbSet(HANDLE_KEY, h);
        return h;
      };

      const bufToBase64 = (buf) => {
        const bytes = new Uint8Array(buf);
        let s = '';
        for (let i = 0; i < bytes.length; i += 0x8000)
          s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        return btoa(s);
      };

      const uploadLocal = async () => {
        const btn = document.getElementById('push-local-btn');
        btn.disabled = true;
        try {
          if (!window.showDirectoryPicker)
            throw new Error('needs Chrome or Edge');
          const token = await findGhToken();
          if (!token) throw new Error('not signed in');
          const gh = makeGh(token);

          setSyncStatus('Reading local folder…', true);
          const dir = await getUploadsDir();
          const files = [];
          for await (const entry of dir.values()) {
            if (entry.kind === 'file' && IMG_RE.test(entry.name))
              files.push(entry);
          }
          if (!files.length) {
            setSyncStatus('No image files found in that folder.', true);
            return;
          }

          setSyncStatus(`Checking ${files.length} file(s) against the repo…`, true);
          const tree = await (
            await gh('/git/trees/main?recursive=1')
          ).json();
          const remote = new Set(
            (tree.tree || [])
              .map((n) => n.path)
              .filter((p) => p.startsWith('public/images/uploads/'))
              .map((p) => p.split('/').pop())
          );
          const fresh = files.filter((f) => !remote.has(f.name));
          if (!fresh.length) {
            setSyncStatus(
              'Everything in that folder is already in the repo — use ↻ Sync media to process it.'
            );
            return;
          }

          // One commit for the whole batch: blobs → tree → commit → ref.
          const head = await (await gh('/git/ref/heads/main')).json();
          const base = await (
            await gh(`/git/commits/${head.object.sha}`)
          ).json();
          const items = [];
          let i = 0;
          for (const fh of fresh) {
            i++;
            setSyncStatus(`Uploading ${i}/${fresh.length} — ${fh.name}`, true);
            const buf = await (await fh.getFile()).arrayBuffer();
            const blob = await (
              await gh('/git/blobs', {
                method: 'POST',
                body: JSON.stringify({
                  content: bufToBase64(buf),
                  encoding: 'base64',
                }),
              })
            ).json();
            items.push({
              path: `public/images/uploads/${fh.name}`,
              mode: '100644',
              type: 'blob',
              sha: blob.sha,
            });
          }
          const newTree = await (
            await gh('/git/trees', {
              method: 'POST',
              body: JSON.stringify({ base_tree: base.tree.sha, tree: items }),
            })
          ).json();
          const newCommit = await (
            await gh('/git/commits', {
              method: 'POST',
              body: JSON.stringify({
                message: `media: upload ${fresh.length} file(s) from local folder`,
                tree: newTree.sha,
                parents: [head.object.sha],
              }),
            })
          ).json();
          const upd = await gh('/git/refs/heads/main', {
            method: 'PATCH',
            body: JSON.stringify({ sha: newCommit.sha }),
          });
          if (!upd.ok)
            throw new Error(
              `ref update HTTP ${upd.status} — someone else committed first, click again to retry`
            );

          setSyncStatus(
            `${fresh.length} file(s) pushed — starting sync…`,
            true
          );
          setSyncStatus(await triggerSync(gh));
        } catch (e) {
          setSyncStatus(`Local push failed (${e.message}).`, true);
        } finally {
          btn.disabled = false;
        }
      };

      // ---- "In gallery" badges on media assets ------------------------------
      // Fetches the content JSONs and marks any upload already referenced by a
      // project gallery, cover, hero or portrait with a badge in the media
      // library and asset picker.
      const normName = (s) =>
        String(s)
          .split('/')
          .pop()
          .trim()
          .replace(/\.(webp|jpe?g|png|avif|gif)$/i, '')
          .replace(/-\d{3,4}$/, '');

      const inUse = new Set();
      // Images picked in the editor during this session — the committed
      // JSONs only update on save, so these are merged in on every refetch.
      const sessionAssigned = new Set();
      const collect = (v, target = inUse) => {
        if (typeof v === 'string' && /\.(webp|jpe?g|png|avif|gif)$/i.test(v)) {
          target.add(normName(v));
        } else if (Array.isArray(v)) v.forEach((x) => collect(x, target));
        else if (v && typeof v === 'object')
          Object.values(v).forEach((x) => collect(x, target));
      };

      const loadUsedImages = async () => {
        try {
          const headers = { Accept: 'application/vnd.github+json' };
          const token = await findGhToken();
          if (token) headers.Authorization = `Bearer ${token}`;
          const tree = await (
            await fetch(
              `https://api.github.com/repos/${SYNC_REPO}/git/trees/main?recursive=1`,
              { headers }
            )
          ).json();
          const files = (tree.tree || [])
            .map((n) => n.path)
            .filter(
              (p) =>
                /^content\/(projects\/[^/]+|site|about)\.json$/.test(p)
            );
          // Contents API (not raw.githubusercontent) so post-save refetches
          // aren't served a stale cached copy.
          const fresh = new Set();
          await Promise.all(
            files.map(async (p) => {
              try {
                const data = await (
                  await fetch(
                    `https://api.github.com/repos/${SYNC_REPO}/contents/${p}?ref=main`,
                    { headers }
                  )
                ).json();
                collect(
                  JSON.parse(atob(String(data.content).replace(/\n/g, ''))),
                  fresh
                );
              } catch {}
            })
          );
          inUse.clear();
          fresh.forEach((n) => inUse.add(n));
          sessionAssigned.forEach((n) => inUse.add(n));
        } catch {}
      };

      const FILE_RE = /[\w][\w\-() .']*\.(?:webp|jpe?g|png|avif|gif)/i;
      const badgeImg = (img) => {
        if (img.dataset.badgeChecked) return;
        img.dataset.badgeChecked = '1';
        const card =
          img.closest('li, [role="option"], [role="listitem"], article') ||
          img.parentElement;
        if (!card) return;
        const candidates = [img.alt, img.title, card.title, card.textContent];
        const hit = candidates.some((c) => {
          const m = c && FILE_RE.exec(c);
          return m && inUse.has(normName(m[0]));
        });
        card.classList.toggle('in-gallery-assigned', !!hit);
        if (!hit || card.querySelector('.in-gallery-badge')) return;
        if (getComputedStyle(card).position === 'static')
          card.style.position = 'relative';
        const b = document.createElement('span');
        b.className = 'in-gallery-badge';
        b.textContent = '✓ In gallery';
        card.appendChild(b);
      };

      const scanBadges = (root) => {
        if (root.nodeType !== 1) return;
        if (root.tagName === 'IMG') badgeImg(root);
        root.querySelectorAll?.('img').forEach(badgeImg);
      };

      // Clear every badge + checked flag and rescan — used whenever the
      // assigned set changes (new pick in the editor, or post-save refetch).
      const rebuildBadges = () => {
        document
          .querySelectorAll('.in-gallery-badge')
          .forEach((b) => b.remove());
        document
          .querySelectorAll('img[data-badge-checked]')
          .forEach((i) => delete i.dataset.badgeChecked);
        scanBadges(document.body);
      };

      // An image assigned to a field in the open editor isn't committed yet,
      // so scrape the field values live and badge those thumbnails too.
      // Sveltia renders the path as plain text (not always an input), so we
      // walk text nodes — but only while the entry editor route is active,
      // and never inside the asset-picker dialog, or the media library's own
      // filename labels would falsely mark everything as in use.
      const FILE_RE_FIELD = /[\w][\w\-() .']*\.(?:webp|jpe?g|png|avif|gif)/i;
      const collectFromEditor = () => {
        if (!/collections|entries/i.test(location.hash)) return;
        let added = false;
        const consider = (v) => {
          const m = v && FILE_RE_FIELD.exec(v);
          if (m) {
            const n = normName(m[0]);
            if (!inUse.has(n)) {
              inUse.add(n);
              sessionAssigned.add(n);
              added = true;
            }
          }
        };
        document
          .querySelectorAll('input, textarea')
          .forEach((el) => consider(el.value));
        const walker = document.createTreeWalker(
          document.body,
          NodeFilter.SHOW_TEXT,
          {
            acceptNode: (node) => {
              if (!node.nodeValue || !FILE_RE_FIELD.test(node.nodeValue))
                return NodeFilter.FILTER_REJECT;
              let p = node.parentElement;
              while (p) {
                if (p.getAttribute?.('role') === 'dialog')
                  return NodeFilter.FILTER_REJECT;
                p = p.parentElement;
              }
              return NodeFilter.FILTER_ACCEPT;
            },
          }
        );
        let node;
        while ((node = walker.nextNode())) consider(node.nodeValue);
        if (added) rebuildBadges();
      };

      let editorScanT;
      const queueEditorScan = () => {
        clearTimeout(editorScanT);
        editorScanT = setTimeout(collectFromEditor, 300);
      };

      // After Sveltia commits a save, refetch the JSONs so badges reflect
      // the real assigned set (and drop badges for removed images).
      let refreshT;
      const queueRefresh = (delay = 8000) => {
        clearTimeout(refreshT);
        refreshT = setTimeout(async () => {
          await loadUsedImages();
          collectFromEditor();
          rebuildBadges();
        }, delay);
      };

      const SAVE_TOAST_RE = /saved|published|updated|committed/i;
      const TOAST_SEL =
        '[role="status"], [role="alert"], [class*="toast"], [class*="snackbar"], [class*="notification"]';
      const looksLikeSaveToast = (el) =>
        el.nodeType === 1 &&
        SAVE_TOAST_RE.test(el.textContent || '') &&
        (el.matches?.(TOAST_SEL) || el.querySelector?.(TOAST_SEL));

      // ---- Conditional field: hide "Anchor side" unless layout = trio -------
      // Sveltia has no dependent fields, so we hide the field wrapper in the
      // DOM. The value still exists in the JSON (harmless on other layouts).
      const LAYOUT_SEL = (sel) =>
        [...sel.options].some((o) => o.value === 'mosaic');
      const tuneBlockFields = () => {
        document.querySelectorAll('label').forEach((lab) => {
          if (lab.textContent.trim() !== 'Anchor side') return;
          // The field wrapper = nearest ancestor containing this field's select.
          let wrap = lab.parentElement;
          while (wrap && !wrap.querySelector('select')) wrap = wrap.parentElement;
          if (!wrap) return;
          // The block item = nearest ancestor containing the layout select
          // (the only select whose options include 'mosaic').
          let block = wrap;
          let layoutSel = null;
          while (block) {
            layoutSel = [...block.querySelectorAll('select')].find(LAYOUT_SEL);
            if (layoutSel) break;
            block = block.parentElement;
          }
          wrap.style.display =
            layoutSel && layoutSel.value === 'trio' ? '' : 'none';
        });
      };
      let tuneT;
      const queueFieldTune = () => {
        clearTimeout(tuneT);
        tuneT = setTimeout(tuneBlockFields, 200);
      };

      new MutationObserver((recs) =>
        recs.forEach((r) =>
          r.addedNodes.forEach((n) => {
            scanBadges(n);
            queueEditorScan();
            queueFieldTune();
            if (looksLikeSaveToast(n)) queueRefresh();
          })
        )
      ).observe(document.body, { childList: true, subtree: true });

      // Field value edits don't produce DOM mutations — listen directly.
      document.addEventListener('change', queueEditorScan, true);
      document.addEventListener('change', queueFieldTune, true);

      // Also refresh when returning to the tab (e.g. after a save committed
      // in another window or a GitHub-side edit).
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) queueRefresh(2000);
      });

      window.addEventListener('DOMContentLoaded', async () => {
        await loadUsedImages();
        scanBadges(document.body);

        const wrap = document.createElement('div');
        wrap.innerHTML = `
          <style>
            #sync-media-btn, #push-local-btn {
              position: fixed; right: 20px; z-index: 99999;
              padding: 10px 18px; border-radius: 999px; cursor: pointer;
              background: #26241f; color: #ece8e0; border: 1px solid #4a463e;
              font: 600 12px/1 'Segoe UI', system-ui, sans-serif;
              letter-spacing: 0.08em; text-transform: uppercase;
            }
            #sync-media-btn { bottom: 20px; }
            #push-local-btn { bottom: 64px; }
            #sync-media-btn:hover, #push-local-btn:hover { background: #33302a; }
            #sync-media-btn:disabled, #push-local-btn:disabled { opacity: 0.5; cursor: default; }
            #sync-media-status {
              position: fixed; right: 20px; bottom: 108px; z-index: 99999;
              max-width: 280px; padding: 8px 14px; border-radius: 8px;
              background: #26241f; color: #ece8e0; border: 1px solid #4a463e;
              font: 12px/1.4 'Segoe UI', system-ui, sans-serif;
              opacity: 0; transition: opacity 0.3s; pointer-events: none;
            }
            .in-gallery-badge {
              position: absolute; top: 6px; left: 6px; z-index: 10;
              padding: 3px 8px; border-radius: 999px;
              background: rgba(22, 101, 52, 0.92); color: #fff;
              font: 600 10px/1 'Segoe UI', system-ui, sans-serif;
              letter-spacing: 0.06em; text-transform: uppercase;
              pointer-events: none;
            }
            .cmp-hide-assigned .in-gallery-assigned { display: none !important; }
            #hide-assigned-wrap {
              position: fixed; left: 20px; bottom: 20px; z-index: 99999;
              display: flex; align-items: center; gap: 7px;
              padding: 10px 16px; border-radius: 999px; cursor: pointer;
              background: #26241f; color: #ece8e0; border: 1px solid #4a463e;
              font: 600 12px/1 'Segoe UI', system-ui, sans-serif;
              letter-spacing: 0.08em; text-transform: uppercase;
              user-select: none;
            }
            #hide-assigned-wrap input { accent-color: #166534; cursor: pointer; }
          </style>
          <label id="hide-assigned-wrap" title="Hide images already assigned to a gallery">
            <input type="checkbox" id="hide-assigned"> Hide assigned
          </label>
          <div id="sync-media-status"></div>
          <button id="push-local-btn" type="button" title="Commit new files from your local uploads folder to the repo, then sync">⇪ Push local folder</button>
          <button id="sync-media-btn" type="button" title="Optimize new uploads, regenerate image sizes, redeploy">↻ Sync media</button>
        `;
        document.body.appendChild(wrap);
        document.getElementById('sync-media-btn').addEventListener('click', syncMedia);
        document.getElementById('push-local-btn').addEventListener('click', uploadLocal);

        const hideToggle = document.getElementById('hide-assigned');
        hideToggle.checked = localStorage.getItem('cmp-hide-assigned') === '1';
        document.body.classList.toggle('cmp-hide-assigned', hideToggle.checked);
        hideToggle.addEventListener('change', () => {
          document.body.classList.toggle('cmp-hide-assigned', hideToggle.checked);
          localStorage.setItem('cmp-hide-assigned', hideToggle.checked ? '1' : '');
        });
      });
    </script>
  </body>
</html>
