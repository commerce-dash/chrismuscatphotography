name: Sync media

# Re-encodes any new non-WebP originals in public/images/uploads into
# WebP masters, regenerates responsive variants under
# public/images/generated, writes alt text for undescribed uploads via
# any OpenAI-compatible vision API (set ALT_API_KEY secret, optional
# ALT_API_BASE / ALT_MODEL repo variables), commits the results, then
# triggers a deploy.
#
# Auth: uses the GH_PAT secret when present (a classic PAT with `repo`
# scope). A PAT push triggers the deploy workflow on its own. Without
# GH_PAT it falls back to GITHUB_TOKEN, which requires the repo's
# "Workflow permissions" setting to be "Read and write permissions"
# (Settings → Actions → General) — with the default read-only setting
# the token cannot push commits or dispatch other workflows.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Optimize new originals
        run: node scripts/optimize-uploads.mjs

      - name: Generate responsive variants
        run: node scripts/build-images.mjs

      - name: Generate alt text for new images
        env:
          ALT_API_KEY: ${{ secrets.ALT_API_KEY }}
          ALT_API_BASE: ${{ vars.ALT_API_BASE }}
          ALT_MODEL: ${{ vars.ALT_MODEL }}
        run: node scripts/generate-alt.mjs

      - name: Commit media changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/images src/data/image-meta.json src/data/placeholders.json content/image-alt.json
          if git diff --cached --quiet; then
            echo "No media changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: sync media (optimize originals, regenerate variants)"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
        id: commit

      - name: Detect PAT auth
        id: pat
        env:
          PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$PAT" ]; then echo "has_pat=true" >> "$GITHUB_OUTPUT"; else echo "has_pat=false" >> "$GITHUB_OUTPUT"; fi

      # With GH_PAT the push above already triggered a deploy run, so the
      # dispatch is only needed on GITHUB_TOKEN auth.
      - name: Trigger deploy
        if: steps.pat.outputs.has_pat == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
