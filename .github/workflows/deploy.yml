name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout private images repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_IMAGES_REPO }}
          token: ${{ secrets.PRIVATE_IMAGES_TOKEN }}
          path: private-images

      - name: Copy private images to public
        run: |
          echo "PRIVATE_IMAGES_REPO: ${{ secrets.PRIVATE_IMAGES_REPO }}"
          echo "Checking if private-images directory exists..."
          ls -la private-images/ || echo "private-images directory not found"
          if [ -d "private-images/public/images" ]; then
            mkdir -p public/images
            echo "Copying images from private-images/public/images to public/images..."
            rsync -av --delete private-images/public/images/ public/
            echo "Copied private images to public/images/"
            echo "Image count in public/images:"
            find public/images -type f | wc -l
          else
            echo "No private images found in private-images/public/images/"
            echo "Directory listing of private-images:"
            ls -la private-images/ || true
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint + typecheck
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Custom domain serves the site from /. To fall back to
          # /<repo-name>/, set VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_BASE_PATH: /
          VITE_SITE_URL: https://chrismuscatphotography.com

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
